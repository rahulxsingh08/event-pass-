<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">CampusPass demo booking flow</title>
  <desc id="desc">Student selects seats, provides attendee details, requests approval if needed, receives a demo ticket, and checks in.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8ba0b9"/></marker>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#223656" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <text x="48" y="54" fill="#142540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">A booking journey, from seat map to check-in</text>
  <text x="48" y="79" fill="#64738b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Illustrates the current browser demo flow; production decisions must be verified by a trusted server.</text>
  <g stroke="#8ba0b9" stroke-width="3" marker-end="url(#arrow)">
    <path d="M208 195h45"/><path d="M424 195h45"/><path d="M640 195h45"/><path d="M856 195h45"/><path d="M1072 195h45"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="48" y="125" width="160" height="140" rx="18" fill="#fff"/><rect x="264" y="125" width="160" height="140" rx="18" fill="#fff"/><rect x="480" y="125" width="160" height="140" rx="18" fill="#fff"/><rect x="696" y="125" width="160" height="140" rx="18" fill="#fff"/><rect x="912" y="125" width="160" height="140" rx="18" fill="#fff"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g><circle cx="128" cy="157" r="17" fill="#d9f7ef"/><text x="128" y="163" fill="#168568" font-size="14" font-weight="700">1</text><text x="128" y="205" fill="#1e2e49" font-size="15" font-weight="700">Select seats</text><text x="128" y="226" fill="#6c7a90" font-size="11">2-minute demo hold</text><text x="128" y="244" fill="#6c7a90" font-size="11">with countdown</text></g>
    <g><circle cx="344" cy="157" r="17" fill="#dcecff"/><text x="344" y="163" fill="#3170c7" font-size="14" font-weight="700">2</text><text x="344" y="205" fill="#1e2e49" font-size="15" font-weight="700">Add attendees</text><text x="344" y="226" fill="#6c7a90" font-size="11">Name and roll number</text><text x="344" y="244" fill="#6c7a90" font-size="11">for each ticket</text></g>
    <g><circle cx="560" cy="157" r="17" fill="#fff0d7"/><text x="560" y="163" fill="#bb7917" font-size="14" font-weight="700">3</text><text x="560" y="205" fill="#1e2e49" font-size="15" font-weight="700">Review request</text><text x="560" y="226" fill="#6c7a90" font-size="11">Sample UPI reference;</text><text x="560" y="244" fill="#6c7a90" font-size="11">no payment is collected</text></g>
    <g><circle cx="776" cy="157" r="17" fill="#e9e1ff"/><text x="776" y="163" fill="#7354c6" font-size="14" font-weight="700">4</text><text x="776" y="205" fill="#1e2e49" font-size="15" font-weight="700">View demo ticket</text><text x="776" y="226" fill="#6c7a90" font-size="11">QR appears after</text><text x="776" y="244" fill="#6c7a90" font-size="11">admin demo approval</text></g>
    <g><circle cx="992" cy="157" r="17" fill="#d9f7ef"/><text x="992" y="163" fill="#168568" font-size="14" font-weight="700">5</text><text x="992" y="205" fill="#1e2e49" font-size="15" font-weight="700">Check in</text><text x="992" y="226" fill="#6c7a90" font-size="11">Local duplicate-use</text><text x="992" y="244" fill="#6c7a90" font-size="11">feedback only</text></g>
  </g>
  <text x="48" y="310" fill="#66758d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Demo data and QR codes are stored in the browser and are not valid for real event entry.</text>
</svg>
